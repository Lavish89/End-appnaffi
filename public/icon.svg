<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#gf-bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#fbbf24" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Dumbbell / Energy Target Glyph -->
  <g transform="translate(256, 256)">
    <!-- Central Bar -->
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="url(#gf-grad)"/>
    <!-- Center Grip Rings -->
    <line x1="-30" y1="-18" x2="-30" y2="18" stroke="#0f172a" stroke-width="6"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#0f172a" stroke-width="6"/>
    <line x1="30" y1="-18" x2="30" y2="18" stroke="#0f172a" stroke-width="6"/>
    
    <!-- Left Weight Plates -->
    <rect x="-175" y="-70" width="35" height="140" rx="14" fill="#fbbf24"/>
    <rect x="-195" y="-55" width="20" height="110" rx="10" fill="#f59e0b"/>
    <circle cx="-195" cy="0" r="14" fill="#020617"/>

    <!-- Right Weight Plates -->
    <rect x="140" y="-70" width="35" height="140" rx="14" fill="#fbbf24"/>
    <rect x="175" y="-55" width="20" height="110" rx="10" fill="#f59e0b"/>
    <circle cx="195" cy="0" r="14" fill="#020617"/>

    <!-- Energy Lightning Bolt at Center -->
    <polygon points="-12,-110 32,-110 8,-20 38,-20 -28,95 -2,0 -32,0" fill="#fbbf24" stroke="#020617" stroke-width="6"/>
  </g>
</svg>
